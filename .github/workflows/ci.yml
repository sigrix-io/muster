name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The schema is checked as a schema, the case table runs against it, and the
  # table is checked too: every member shown in a valid case, every required
  # one taken away in an invalid one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Test
        run: python -m pytest -q

  # The aggregate gate. One check to require on main, so adding a job above
  # does not mean editing the branch ruleset to match.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
